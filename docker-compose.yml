services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-egocentrism}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-egocentrism}
      POSTGRES_DB: ${POSTGRES_DB:-egocentrism}
    volumes:
      # Named volume = Docker-managed storage on this instance's disk.
      # Fine for prototyping. Once the schema stabilises, dump this and
      # restore into a managed Nectar Trove instance for durability.
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432" # bound to localhost only, not the public IP
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-egocentrism}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: egocentrism-app
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-egocentrism}:${POSTGRES_PASSWORD:-egocentrism}@db:5432/${POSTGRES_DB:-egocentrism}
    volumes:
      - ./src:/app/src
      - ./.git:/app/.git:ro
      - ${HOME}/.aws:/root/.aws:ro
      # Mount your attached Nectar volume here (see README) so downloaded
      # video/scratch data lands on the big persistent disk, not the
      # instance's small root disk.
      - /mnt/data-volume:/data/scratch
      - /mnt/data-volume/2026:/app/2026
    stdin_open: true
    tty: true

  notebook:
    image: egocentrism-app
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-egocentrism}:${POSTGRES_PASSWORD:-egocentrism}@db:5432/${POSTGRES_DB:-egocentrism}
    volumes:
      - ./src:/app/src
      - ./.git:/app/.git:ro
      - ${HOME}/.aws:/root/.aws:ro
      - ./notebooks:/app/notebooks
      - /mnt/data-volume:/data/scratch
      - /mnt/data-volume/2026:/app/2026
    ports:
      # bound to localhost only — reach it via an SSH tunnel (see README),
      # never expose 8888 directly on the instance's public floating IP
      - "127.0.0.1:8888:8888"
    command: >
      jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root
      --ServerApp.root_dir=/app --ServerApp.notebook_dir=/app

volumes:
  pgdata: